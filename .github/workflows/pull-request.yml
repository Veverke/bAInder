name: pull-request

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build:chrome

      - name: Run unit tests
        run: npm run test:coverage

      - name: Get Playwright version
        id: pw-version
        run: |
          VERSION=$(node -e "console.log(require('./node_modules/@playwright/test/package.json').version)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Playwright version: $VERSION"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          # Use curl + unzip to avoid Node.js in-memory zip extraction hanging
          BROWSER_URL=$(npx playwright install --dry-run chromium 2>&1 | grep -o 'https://[^ ]*\.zip' | head -1)
          if [ -n "$BROWSER_URL" ]; then
            echo "Downloading from: $BROWSER_URL"
            curl -L --progress-bar --retry 3 --retry-delay 5 -o /tmp/chromium.zip "$BROWSER_URL"
            echo "Extracting..."
            DEST=$(npx playwright install --dry-run chromium 2>&1 | grep -o '/home/[^ ]*\|/root/[^ ]*' | head -1 | xargs dirname 2>/dev/null || echo "$HOME/.cache/ms-playwright")
            mkdir -p "$HOME/.cache/ms-playwright"
            unzip -q /tmp/chromium.zip -d "$HOME/.cache/ms-playwright/"
            rm /tmp/chromium.zip
            echo "Extraction complete"
          else
            echo "Could not detect download URL, falling back to playwright install"
            npx playwright install chromium
          fi

      - name: Install Playwright system dependencies
        timeout-minutes: 10
        run: |
          echo "::group::apt-get update"
          sudo apt-get update -q
          echo "::endgroup::"
          echo "::group::playwright install-deps"
          sudo npx playwright install-deps chromium
          echo "::endgroup::"
          echo "Playwright deps installed successfully"
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_LISTCHANGES_FRONTEND: none

      - name: Run E2E tests
        run: xvfb-run --auto-servernum -- npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: ./test-results/**/*.xml
    
    
